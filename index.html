<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alprkan Store</title>
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <div class="curds">

        <div class="head">
            <h2>البركان استور</h2>
            <p>كل اللي بنبيعه النهارده</p>
        </div>

        <div class="input">

            <input type="text" id="title" placeholder="Title">

            <div class="price">

                <input onkeyup="get_total()" type="number" id="price" placeholder="Price">

                <input onkeyup="get_total()" type="number" id="taxes" placeholder="Taxes">

                <input onkeyup="get_total()" type="number" id="ads" placeholder="Ads">

                <input onkeyup="get_total()" type="number" id="discount" placeholder="Discount">

                <small id="total"></small>

            </div>

            <input type="number" id="count" placeholder="Count" min="1">

            <input type="text" id="category" placeholder="Category">

            <button id="submit">Create</button>

        </div>

        <div class="output">

            <div class="search">

                <input
                    onkeyup="searchData(this.value)"
                    type="text"
                    id="search"
                    placeholder="Search By Title"
                >

                <div class="btnsearch">

                    <button onclick="getsearch(this.id)" id="search-title">
                        Search By Title
                    </button>

                    <button onclick="getsearch(this.id)" id="search-category">
                        Search By Category
                    </button>

                </div>

            </div>

            <div class="money-stats">

    <div class="money-box">
        <span>Total Products</span>
        <strong id="productsTotal">0</strong>
    </div>

    <div class="money-box">
        <span>Total Money</span>
        <strong id="moneyTotal">0</strong>
    </div>

    <div id="categoryTotals" class="category-totals"></div>

</div>

            <div id="deleteAll"></div>

            <div class="table-container">

                <table>

                    <thead>

                        <tr>
                            <th>id</th>
                            <th>title</th>
                            <th>price</th>
                            <th>taxes</th>
                            <th>ads</th>
                            <th>discount</th>
                            <th>total</th>
                            <th>category</th>
                            <th>update</th>
                            <th>delete</th>
                        </tr>

                    </thead>

                    <tbody id="tbody"></tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="js.js"></script>

</body>

</html>
